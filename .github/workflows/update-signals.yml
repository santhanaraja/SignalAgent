name: Update Signal Data

on:
  schedule:
    # Every 15 minutes during US market hours (Mon-Fri, 9:30 AM - 4:30 PM ET)
    # GitHub Actions uses UTC — ET is UTC-5 (EST) or UTC-4 (EDT)
    # 9:30 AM ET = 14:30 UTC (EST) / 13:30 UTC (EDT)
    # 4:30 PM ET = 21:30 UTC (EST) / 20:30 UTC (EDT)
    # We cover both EST/EDT by running 13:30-21:30 UTC
    - cron: '*/15 13-21 * * 1-5'

  # Allow manual trigger from GitHub UI
  workflow_dispatch:

permissions:
  contents: write

# Serialize with rotate-universe.yml — both commit data artifacts to main
concurrency:
  group: signal-data-commits
  cancel-in-progress: false

jobs:
  update-signals:
    runs-on: ubuntu-latest
    # 30 min: a run that self-heals a missed Friday rotation carries a full
    # ~530-ticker universe rebuild before the signal scan (rotate-universe.yml
    # budgets 30 for the rebuild alone; see get_industry_groups self-healing)
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # BAKE FROM THE NEWEST BASE, NOT THE ONE THE RUNNER HAPPENED TO GET.
      # A checkout can predate a push that lands while the job queues or
      # installs: on 2026-09-28 a runner baked from e03c9e1 and only saw
      # 2b70931 at push time, three attempts in a row. Resetting here closes
      # the window between checkout and bake; the retry below closes the one
      # between bake and push.
      - name: Sync to origin/main before baking
        run: |
          git fetch origin main
          git reset --hard origin/main
          echo "baking from $(git rev-parse --short HEAD)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Signal Engine
        run: python signal_engine.py
        env:
          PYTHONUNBUFFERED: '1'

      # D-012: append today's Fear & Greed reading to data/fear_greed_history.json
      # (once-per-day upsert inside the script — last write of the day wins, so
      # the post-close run leaves the closing value). Reads the committed universe
      # artifact for the Market Internals breadth row (no extra universe fetch).
      # Rides the data commit below. continue-on-error + the script never exits
      # non-zero: an F&G/network hiccup must never block the data pipeline.
      - name: Persist Fear & Greed history
        continue-on-error: true
        run: python fear_greed_engine.py
        env:
          PYTHONUNBUFFERED: '1'

      # Framework runs BEFORE the history manager: history_manager reads
      # public/framework.json to log regime_change events (PER-508 item 18),
      # which must reflect THIS run's regime, not the previous one's.
      # continue-on-error: a framework failure leaves the previous artifact
      # in place (no regime change seen) and must not block signal history.
      - name: Run Framework Engine
        run: python -m framework.framework_runner
        env:
          PYTHONUNBUFFERED: '1'
          # Gauge B (D-008): the chassis credit throttle's VALIDATED basis is
          # the FRED OAS 60d percentile — without this key it degrades to the
          # HYG/IEF fallback basis (visibly flagged CHASSIS DEGRADED on the
          # framework page). The secret must exist in repo settings.
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        continue-on-error: true

      - name: Run History Manager
        run: python history_manager.py

      # PER-510-B: intraday stop-breach alerts, HOLDINGS only. Gated
      # in-script to market hours (9:30 <= ET < 16:00), once per ticker per
      # tier per day (data/last_intraday_alerts rides the data commit).
      # CADENCE REALITY: this fires on the throttled hourly runs (~5x/day),
      # so detection lag is up to ~an hour — an hourly check, not a tick
      # watcher. Information only; the close still decides (R11). Same
      # never-fail/never-leak contract as items 22/23.
      - name: Intraday stop-breach alerts
        continue-on-error: true
        env:
          ASSESSMENT_WEBHOOK_URL: ${{ secrets.ASSESSMENT_WEBHOOK_URL }}
          PYTHONUNBUFFERED: '1'
        run: python notify_intraday.py

      # PER-508 item 22: post-close Slack push. Gating (ET hour >= 16,
      # weekday, once per trading day) is computed INSIDE the script —
      # GitHub throttles this cron, so slot timing is unreliable. Placed
      # BEFORE the commit step so the data/last_notified marker rides the
      # data commit (fresh clone every run; an uncommitted marker would
      # double-post on the next throttled run). A Slack outage must never
      # block the data pipeline: continue-on-error here AND the script
      # itself never exits non-zero.
      - name: Post-close assessment notification
        continue-on-error: true
        env:
          ASSESSMENT_WEBHOOK_URL: ${{ secrets.ASSESSMENT_WEBHOOK_URL }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          PYTHONUNBUFFERED: '1'
        run: python notify_assessment.py

      - name: Check for changes
        id: check
        run: |
          git diff --quiet public/ data/ framework/ || echo "changed=true" >> $GITHUB_OUTPUT

      # RESET AND RE-BAKE, NEVER REBASE. `git pull --rebase` replayed a
      # generated commit onto newer generated files and conflicted on every
      # one of them — data/signals.json, history.json, grade_outcomes.json,
      # framework/output/latest.json, public/framework.json,
      # regime_chassis_state.json, regime_history.json,
      # framework/state/position_state.json, plus rename/delete pairs from
      # the snapshot rotation. Three failures in twenty-seven hours against
      # four in the previous five hundred runs.
      #
      # A generated artifact has no merge: the newest bake from the newest
      # base wins and the older one is discarded whole. On rejection this
      # throws away a good bake and pays ~56s for another (the measured bake
      # time on 2026-09-28), capped at two retries — worst case about three
      # and a half minutes against a ~75s job.
      #
      # `merge=ours` was considered and REFUSED: it resolves every future
      # collision silently, and position_state.json carries the ladder
      # anchors the drift detector reads. A silent wrong answer is the
      # failure class this repo keeps hitting.
      - name: Commit and push updated data
        if: steps.check.outputs.changed == 'true'
        # The retry re-bakes, so this step needs every secret the bake steps
        # have. Without them a re-bake silently degrades: the chassis falls
        # back from the FRED OAS basis to HYG/IEF and the intraday alert has
        # no webhook. A retry must produce the SAME artifact the first bake
        # would have, not a weaker one.
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ASSESSMENT_WEBHOOK_URL: ${{ secrets.ASSESSMENT_WEBHOOK_URL }}
          PYTHONUNBUFFERED: '1'
        run: |
          set -uo pipefail
          git config user.name "SignalAgent Bot"
          git config user.email "signal-bot@users.noreply.github.com"
          PATHS="public/signals.json public/history.json public/snapshots/ data/ public/framework.json framework/output/ framework/state/ public/universe_ranking.json public/universe_candidates.json"
          for attempt in 1 2 3; do
            git add $PATHS
            if git diff --cached --quiet; then
              echo "attempt $attempt: nothing staged — the re-bake produced no change; nothing to push"
              exit 0
            fi
            git commit -m "data: update signals $(date -u +'%Y-%m-%d %H:%M UTC')"
            if git push; then
              echo "attempt $attempt: pushed $(git rev-parse --short HEAD)"
              exit 0
            fi
            echo "attempt $attempt: push REJECTED — discarding this bake and re-baking from the new base"
            if [ "$attempt" -eq 3 ]; then break; fi
            git fetch origin main
            git reset --hard origin/main
            bash scripts/bake.sh --no-notify || {
              echo "::error::re-bake failed on attempt $attempt"; exit 1; }
          done
          echo "::error::push rejected after 3 attempts — the artifact was NOT committed. \
          This run is a real failure: the ladder has not stepped this close and the \
          site is serving the previous bake."
          exit 1
